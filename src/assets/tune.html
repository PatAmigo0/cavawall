<!doctype html>
<html lang=en>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>cavawall tune</title>
<style>
/* Graphite chrome that stays out of the way: the wallpaper is the subject.
   The accent is the visualiser's own gradient, fetched live, so the controls
   wear the colours the bars will. */
:root{
  color-scheme:dark;
  --ink0:#0d0d11; --ink1:#15151b; --ink2:#1d1d25; --ink3:#262630;
  --line:#2d2d38; --text:#ebe9f2; --muted:#8e8c9e; --faint:#5d5b6c;
  --accent:#ffa726; --accent2:#ff7043; --grad:linear-gradient(90deg,#ffcc80,#e65100);
  --good:#86d9a4; --warn:#ffb347; --bad:#ff6b6b;
  --r:7px;
  --display:"Fira Sans Compressed","Fira Sans Condensed","Roboto Condensed","Arial Narrow",sans-serif;
  --body:"Fira Sans","Inter",system-ui,sans-serif;
  --mono:"JetBrainsMono NF","JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--ink0);color:var(--text);font:13px/1.45 var(--body);display:grid;
  grid-template-rows:auto 1fr auto;min-width:0}
button,input,select{font:inherit;color:inherit}
kbd{font:10px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:6px}
.btn{background:var(--ink2);border:1px solid var(--line);border-radius:var(--r);padding:5px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--ink3)}
.btn:focus-visible,.seg button:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,.cell:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.primary{background:var(--accent);color:#1a1208;border-color:transparent;font-weight:600}
.btn.primary:disabled{background:var(--ink3);color:var(--faint);cursor:default}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--text);background:var(--ink2)}
.btn.small{padding:2px 8px;font-size:12px}
.icon{width:26px;height:26px;padding:0;display:inline-grid;place-items:center}

/* header */
header{display:flex;align-items:center;gap:14px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--ink1);min-width:0}
.brand{font:600 17px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.brand b{font-weight:400;color:var(--muted)}
.mark{width:18px;height:14px;display:inline-flex;gap:2px;align-items:flex-end}
.mark i{display:block;width:4px;border-radius:1px;background:var(--grad)}
.wp{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.wp #wpname{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:28vw}
.key{font:11px var(--mono);color:var(--faint)}
.seg{display:inline-flex;background:var(--ink0);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{background:none;border:0;border-radius:6px;padding:4px 14px;cursor:pointer;color:var(--muted);font:500 13px var(--body)}
.seg button[aria-selected=true]{background:var(--ink3);color:var(--text);box-shadow:inset 0 -2px 0 var(--accent)}
.grow{flex:1}
.live{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.dot.on{background:var(--good);box-shadow:0 0 0 3px #86d9a422}
.dot.off{background:var(--bad)}

/* stage: the wallpaper fills the window, and every panel floats over it */
main{position:relative;min-height:0;min-width:0}
.stage{position:absolute;inset:0;overflow:hidden;background:
  radial-gradient(circle at 50% 50%,#17171e,var(--ink0) 70%)}
.view{position:absolute;inset:0;display:grid;place-items:center;transform-origin:0 0}
.view canvas{grid-area:1/1;max-width:100%;max-height:100%;display:block}
#ui{cursor:crosshair;touch-action:none}
body[data-figure=bars] #ui,body[data-figure=circle] #ui{cursor:default}
.tools{position:absolute;top:12px;left:12px;display:flex;gap:6px;align-items:center;background:#15151bdd;
  backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:10px;padding:5px}
.tools .sep{width:1px;height:20px;background:var(--line);margin:0 2px}
.tool[aria-pressed=true]{background:var(--ink3);box-shadow:inset 0 -2px 0 var(--accent)}
body:not([data-figure=curve]) .curve-only{display:none!important}
.zoom{font:11px var(--mono);color:var(--muted);min-width:40px;text-align:center}
.hint{position:absolute;left:12px;bottom:10px;z-index:1;font-size:12px;color:var(--muted);background:#15151bcc;border-radius:6px;padding:3px 8px;pointer-events:none}

/* floating glass: the dock, the layers card and the popovers */
.glass{background:#15151bec;backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 36px #0007}
.dock{position:absolute;top:12px;right:12px;max-height:calc(100% - 24px);width:332px;display:flex;flex-direction:column;overflow:hidden;z-index:3;transition:transform .2s}
.dock .tabs{display:flex;align-items:center;gap:2px;padding:6px 6px 0;border-bottom:1px solid var(--line)}
.dock .tabs [role=tab]{background:none;border:0;border-bottom:2px solid transparent;padding:6px 12px 8px;cursor:pointer;color:var(--muted);font:600 12px/1 var(--display);letter-spacing:.12em;text-transform:uppercase}
.dock .tabs [role=tab][aria-selected=true]{color:var(--text);border-bottom-color:var(--accent)}
.dock .tabs .grow{flex:1}
.pane{overflow-y:auto;overscroll-behavior:contain;flex:1}
.grip{margin-left:auto;cursor:grab;touch-action:none;color:var(--faint);letter-spacing:-2px}
.grip:active{cursor:grabbing}
.dock.placed{right:auto}
.card .sec:first-child h2{cursor:pointer;user-select:none}
.card .sec:first-child h2::before{content:'▾';font-size:10px;color:var(--faint);margin-right:2px;transition:transform .15s}
.card.collapsed .sec:first-child h2::before{transform:rotate(-90deg)}
.card.collapsed .sec:first-child > :not(h2),.card.collapsed .sec:not(:first-child){display:none}
.card.collapsed .sec:first-child{padding-bottom:10px}
body.folded .dock{transform:translateX(calc(100% - 40px))}
body.folded .dock .pane{display:none}
.card{position:absolute;left:12px;top:62px;width:268px;max-height:calc(100% - 112px);overflow-y:auto;z-index:2}
.card > .sec:last-child{border-bottom:0}
.pop{position:absolute;z-index:4;width:250px;padding:0}
.pop .sec{border-bottom:0}
#viewPop,#keysPop{top:58px;left:12px}
#keysPop{width:330px}
.cost{display:inline-block;font:500 10px/1 var(--mono);color:var(--warn);border:1px solid #ffb34755;border-radius:4px;padding:2px 5px;margin-left:6px;vertical-align:1px}
.stop{display:grid;grid-template-columns:28px 1fr 64px 18px;gap:6px;align-items:center;min-height:30px}
.stop input[type=color]{width:28px;height:22px;border:1px solid var(--line);border-radius:5px;padding:0;background:none;cursor:pointer}
.stop input[type=color]:disabled{cursor:default}
.stop select{min-width:0}
.stop button{background:none;border:0;color:var(--faint);cursor:pointer;padding:0}
.stop button:hover{color:var(--bad)}
.sec{border-bottom:1px solid var(--line);padding:12px 14px 14px}
.sec h2{margin:0 0 10px;font:600 12px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.sec h2 .aside{margin-left:auto;font:400 11px var(--body);letter-spacing:0;text-transform:none;color:var(--faint)}
.readout{font:600 30px/1 var(--display);letter-spacing:.02em}
.readout small{font:400 12px var(--body);color:var(--muted);margin-left:6px}
.row{display:grid;grid-template-columns:86px 1fr 54px 18px;align-items:center;gap:8px;min-height:28px}
.row label{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row output{font:12px var(--mono);text-align:right}
.row.inherited output{color:var(--faint)}
.row .reset{visibility:hidden;background:none;border:0;color:var(--faint);cursor:pointer;padding:0;font-size:13px}
.row:not(.inherited) .reset{visibility:visible}
.row .reset:hover{color:var(--text)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--accent) var(--p,50%),var(--ink3) var(--p,50%))}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--ink3)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--accent)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--text);margin-top:-5px;border:2px solid var(--ink1)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--text);border:2px solid var(--ink1)}
.row.inherited input[type=range]::-webkit-slider-thumb{background:var(--faint)}
.row.inherited input[type=range]::-moz-range-thumb{background:var(--faint)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;cursor:pointer;font-size:12px;color:var(--muted)}
.chip[aria-pressed=true]{color:var(--text);border-color:var(--accent);background:#ffa72614}
.note{font-size:12px;color:var(--faint);margin:6px 0 0}
.note b{color:var(--muted);font-weight:500}
select{background:var(--ink2);border:1px solid var(--line);border-radius:6px;padding:3px 6px}

/* anchor picker: the nine anchors as the output they pin to */
.anchors{display:grid;grid-template-columns:repeat(3,26px);grid-template-rows:repeat(3,18px);gap:3px;
  padding:5px;background:var(--ink0);border:1px solid var(--line);border-radius:6px;width:max-content}
.anchors button{border:0;border-radius:3px;background:var(--ink3);cursor:pointer;padding:0}
.anchors button[aria-pressed=true]{background:var(--accent)}
.placement{display:flex;gap:12px;align-items:center}

/* layers */
.layers{display:grid;gap:3px}
.layer{display:grid;grid-template-columns:14px 1fr auto;gap:8px;align-items:center;padding:5px 8px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.layer:hover{background:var(--ink2)}
.layer[aria-selected=true]{background:var(--ink2);border-color:var(--line)}
.swatch{width:12px;height:12px;border-radius:3px}
.layer .meta{font:11px var(--mono);color:var(--faint)}
.layer input{background:transparent;border:0;padding:0;width:100%;outline:none}
.layer input:focus{border-bottom:1px solid var(--accent)}
.grid-links{margin-top:10px;border-collapse:separate;border-spacing:3px;font-size:11px}
.grid-links th{font-weight:400;color:var(--muted);text-align:center;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid-links th.rowh{text-align:right;padding-right:4px}
.cell{width:26px;height:22px;border-radius:5px;border:1px solid var(--line);background:var(--ink0);cursor:pointer;padding:0}
.cell[data-state=on]{background:var(--c);border-color:transparent}
.cell[data-state=all]{background:repeating-linear-gradient(45deg,var(--c) 0 3px,transparent 3px 6px);opacity:.7}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* status */
footer{display:flex;gap:14px;align-items:center;padding:5px 14px;border-top:1px solid var(--line);background:var(--ink1);font-size:12px;color:var(--muted);min-width:0}
footer #status{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dirty{font:11px var(--mono)}
#dirty.on{color:var(--warn)}
.toast{position:fixed;left:50%;bottom:46px;transform:translate(-50%,20px);opacity:0;background:var(--ink2);border:1px solid var(--line);
  border-radius:9px;padding:8px 14px;box-shadow:0 10px 30px #0008;transition:transform .18s,opacity .18s;pointer-events:none}
.toast.show{transform:translate(-50%,0);opacity:1}
.toast.bad{border-color:var(--bad)}
@media (max-width:900px){.dock{width:min(332px,calc(100vw - 24px))}.card{width:min(268px,calc(100vw - 24px))}.wp #wpname{max-width:34vw}}
@media (prefers-reduced-motion:reduce){.toast,.dock{transition:none}}
</style>
<body data-figure=bars>
<header>
  <div class=brand><span class=mark><i style="height:6px"></i><i style="height:13px"></i><i style="height:9px"></i></span>cavawall<b>tune</b></div>
  <div class=wp><span id=wpname>…</span><span class=key id=wpkey>__KEY__</span></div>
  <div class=seg id=figure role=tablist aria-label=Figure>
    <button role=tab data-fig=bars>Bars</button><button role=tab data-fig=circle>Circle</button><button role=tab data-fig=curve>Curve</button>
  </div>
  <div class=grow></div>
  <div class=live><span class=dot id=liveDot></span><span id=liveText>checking cavawall…</span></div>
  <button class="btn primary" id=save disabled>Save &amp; apply<kbd>Ctrl S</kbd></button>
</header>
<main>
  <section class=stage id=stage>
    <div class=view id=view><canvas id=base></canvas><canvas id=fx></canvas><canvas id=ui></canvas></div>
    <div class=tools>
      <button class="btn icon tool curve-only" id=toolSelect title="Add and move points (V)" aria-pressed=true>✚</button>
      <button class="btn icon tool curve-only" id=toolPaint title="Paint a stroke (P)" aria-pressed=false>✎</button>
      <button class="btn icon tool curve-only" id=toolOcc title="Edit the selected occluder (O)" aria-pressed=false>◭</button>
      <span class="sep curve-only"></span>
      <button class="btn icon" id=undo title="Undo (Ctrl Z)">↶</button>
      <button class="btn icon" id=redo title="Redo (Ctrl Shift Z)">↷</button>
      <span class=sep></span>
      <button class="btn icon" id=fit title="Fit to window (0)">⤢</button>
      <span class=zoom id=zoomv>100%</span>
      <button class="btn icon" id=play title="Animate the preview (Space)" aria-pressed=true>❚❚</button>
      <span class=sep></span>
      <button class="btn icon" id=viewBtn title="View" aria-expanded=false>◐</button>
      <button class="btn icon" id=keysBtn title="Keys (?)" aria-expanded=false>?</button>
    </div>
    <div class="card glass curve-only" id=layersCard></div>
    <div class="pop glass" id=pointPop hidden></div>
    <div class="pop glass" id=viewPop hidden></div>
    <div class="pop glass" id=keysPop hidden></div>
    <div class=hint id=hint></div>
    <aside class="dock glass" id=dock>
      <div class=tabs role=tablist aria-label=Settings>
        <button class="btn ghost icon" id=dockFold title="Fold the panel" aria-label="Fold the panel">⟩</button>
        <button role=tab data-tab=shape aria-selected=true>Shape</button><button role=tab data-tab=look aria-selected=false>Look</button><button role=tab data-tab=sound aria-selected=false>Cava</button>
        <button class="btn ghost icon grip" id=dockGrip title="Drag to move the panel; double-click to put it back" aria-label="Move the panel">⠿⠿</button>
      </div>
      <div class=pane id=paneShape></div><div class=pane id=paneLook hidden></div><div class=pane id=paneSound hidden></div>
    </aside>
  </section>
</main>
<footer><span id=status>Loading the wallpaper…</span><span class=grow></span><span id=dirty>saved</span></footer>
<div class=toast id=toast role=status></div>
<script>
'use strict';
// An error anywhere says so on the page instead of failing silently
addEventListener('error', e => toast('Page error: ' + e.message, true));
addEventListener('unhandledrejection', e => toast('Page error: ' + (e.reason && e.reason.message || e.reason), true));
// ---------------------------------------------------------------- basics
const $ = id => document.getElementById(id);
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const r4 = v => Math.round(v * 1e4) / 1e4;
const isNum = v => typeof v === 'number' && Number.isFinite(v);
const img = new Image();
const base = $('base'), fx = $('fx'), ui = $('ui');
const bx = base.getContext('2d'), fxx = fx.getContext('2d'), ux = ui.getContext('2d');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

// The renderer's own defaults, so an unset field previews as it will draw
const RENDER = {path_height: 0.18, path_width: 0.006, circle_diameter: 520, inner_radius: 0.35,
  inner_alpha: 1, outer_alpha: 1, max_height: 1, opacity: 1, matte: 0, radius: 0, reveal: 0, blocks: 0,
  left: 0, span: 1, baseline: 1};
// Paths and occluders are told apart by colour in the editor and the grid
const PATH_COLOURS = ['#ff5c5c', '#ffb14a', '#f7e36b', '#7fe0a0', '#5cc8ff', '#b28dff', '#ff7ad9', '#a0e0e0'];
const OCC_COLOURS = ['#30d5c8', '#8ab4f8', '#f28b82', '#fdd663', '#81c995', '#c58af9', '#78d9ec', '#fcad70'];

// ---------------------------------------------------------------- state
const S = {
  W: {}, ctx: {},
  fig: 'bars',
  bars: {}, circle: {},
  curve: {bars: undefined, fit: 'cover', height: undefined, width: undefined},
  paths: [], occ: [],
  cur: 0, curOcc: -1, sel: -1,
  tool: 'select', occEdit: false,
  reveal: {source: 'wallpaper', filter: {}, image: null, canvas: null, changed: false},
  out: {w: 1920, h: 1080},
  view: {zoom: 1, panx: 0, pany: 0, dim: 0, frame: true, handles: true, play: !reduceMotion, lw: 3, dot: 5, grab: 10},
};
let saved = '', hist = [], future = [];
const cp = () => S.paths[S.cur];

// ---------------------------------------------------------------- loading
img.onload = () => {
  const k = Math.min(1, 2560 / img.naturalWidth);
  for (const c of [base, fx, ui]) { c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k); }
  Promise.all([fetch('/existing').then(r => r.json()), fetch('/context').then(r => r.json())])
    .then(([w, ctx]) => { load(w || {}, ctx || {}); })
    .catch(e => toast('Could not load settings: ' + e.message, true));
};
img.onerror = () => toast('The wallpaper did not load', true);
img.src = '/wallpaper';

function load(W, ctx) {
  S.W = W; S.ctx = ctx;
  const st = ctx.status || {};
  if (Array.isArray(st.output_size)) S.out = {w: st.output_size[0], h: st.output_size[1]};
  else S.out = {w: screen.width || 1920, h: screen.height || 1080};
  S.fig = W.mode || ctx.defaults?.mode || 'bars';
  const cfg = ctx.config || {};
  S.g = {general: {...(cfg.general || {})}, smoothing: {...(cfg.smoothing || {})}, colors: {...(cfg.colors || {})}, scheme: {...(cfg.scheme || {})}, notify: {...(cfg.notify || {})}, wallpaper: {...(cfg.wallpaper || {})}};
  S.g0 = JSON.stringify(S.g);
  S.bars = {...(W.bars || {})};
  S.circle = {...(W.circle || {})};
  S.reveal.source = S.bars.reveal_source || (ctx.reveal_source ? 'auto' : 'wallpaper');
  S.reveal.filter = parseFilter(S.bars.reveal_filter || '');
  const c = W.curve || {};
  S.curve = {bars: c.bars, fit: c.fit || 'cover', height: c.height, width: c.width};
  // Occluders, whichever way the file wrote them, become one list of named
  // shapes, and each path says which cut it: null is "all of them"
  S.occ = (c.occluder || []).filter(o => (o.points || []).length)
    .map((o, i) => ({name: o.name || `shape ${i + 1}`, shape: o.shape === 'closed' ? 'closed' : 'skyline', pts: o.points.map(v => ({x: v[0], y: v[1]}))}));
  const uniq = base => { let n = base, i = 2; while (S.occ.some(o => o.name === n)) n = `${base} ${i++}`; return n; };
  if ((c.occlude || []).length > 1) S.occ.push({name: uniq('shared'), shape: 'skyline', pts: c.occlude.map(v => ({x: v[0], y: v[1]}))});
  const src = (c.path && c.path.length) ? c.path : (c.points ? [c] : []);
  S.paths = src.map((p, i) => {
    let cut = Array.isArray(p.cut_by) ? p.cut_by.slice() : null;
    if (p.clip === false) cut = [];
    else if (!cut && (p.occlude || []).length > 1) {
      const name = uniq(`path ${i + 1}`);
      S.occ.push({name, shape: 'skyline', pts: p.occlude.map(v => ({x: v[0], y: v[1]}))});
      cut = [name];
    }
    return {pts: (p.points || []).map(v => ({x: v[0], y: v[1], s: v[2] ?? 1, a: v.length > 3 ? v[3] : null})),
      bars: src === c.path ? (p.bars ?? null) : null, height: p.height ?? null, width: p.width ?? null,
      up: !!(p.upright ?? c.upright), fl: !!(p.flip ?? c.flip), cut};
  }).filter(p => p.pts.length);
  if (!S.paths.length) S.paths = [newPath()];
  S.cur = 0; S.curOcc = S.occ.length ? 0 : -1;
  $('wpname').textContent = (ctx.wallpaper || '').split('/').pop() || 'wallpaper';
  setAccent(ctx.gradient);
  live(st);
  if (S.reveal.source === 'auto' && ctx.reveal_source) loadRevealSource();
  else if (S.reveal.source === 'wallpaper') { S.reveal.image = img; bakeRevealCanvas(); }
  saved = JSON.stringify(payload());
  hist = []; future = [];
  buildInspector(); setFigure(S.fig, true); fitView(); drawBase(); drawUI(); startLoop();
  status();
}

function newPath() {
  const p = cp();
  return {pts: [], bars: null, height: p ? p.height : null, width: p ? p.width : null, up: p ? p.up : true, fl: false, cut: null};
}

// ---------------------------------------------------------------- colour
let STOPS = [[255, 204, 128, 1], [230, 81, 0, 1]];
function setAccent(g) {
  if (Array.isArray(g) && g.length) STOPS = g.length === 1 ? [g[0], g[0]] : g;
  const css = STOPS.map(s => `rgb(${s[0]},${s[1]},${s[2]})`);
  const mid = STOPS[Math.floor(STOPS.length / 2)];
  document.documentElement.style.setProperty('--grad', `linear-gradient(90deg,${css.join(',')})`);
  document.documentElement.style.setProperty('--accent', `rgb(${mid[0]},${mid[1]},${mid[2]})`);
}

// The dock goes wherever it is dragged, and stays there next time
function placeDock(x, y) {
  const st = $('stage').getBoundingClientRect(), d = $('dock');
  x = clamp(x, 8, st.width - d.offsetWidth - 8); y = clamp(y, 8, st.height - 48);
  d.classList.add('placed'); d.style.left = x + 'px'; d.style.top = y + 'px';
  d.style.maxHeight = `calc(100% - ${y + 12}px)`;
  return [x, y];
}
function resetDock() {
  const d = $('dock'); d.classList.remove('placed'); d.style.left = d.style.top = d.style.maxHeight = '';
  try { localStorage.removeItem('dockPos'); } catch {}
}
{
  const grip = $('dockGrip'); let from = null;
  grip.addEventListener('pointerdown', e => {
    const r = $('dock').getBoundingClientRect(), st = $('stage').getBoundingClientRect();
    from = {dx: e.clientX - (r.left - st.left), dy: e.clientY - (r.top - st.top)}; grip.setPointerCapture(e.pointerId);
  });
  grip.addEventListener('pointermove', e => { if (from) placeDock(e.clientX - from.dx, e.clientY - from.dy); placePointPop(); });
  grip.addEventListener('pointerup', () => {
    if (!from) return; from = null;
    const d = $('dock'); if (!d.classList.contains('placed')) return;
    try { localStorage.setItem('dockPos', JSON.stringify([parseFloat(d.style.left), parseFloat(d.style.top)])); } catch {}
  });
  grip.addEventListener('dblclick', resetDock);
  try { const p = JSON.parse(localStorage.getItem('dockPos') || 'null'); if (p) requestAnimationFrame(() => placeDock(p[0], p[1])); } catch {}
  addEventListener('resize', () => { const d = $('dock'); if (d.classList.contains('placed')) placeDock(parseFloat(d.style.left), parseFloat(d.style.top)); });
}

// The point editor sits beside the point it edits
function placePointPop() {
  const pop = $('pointPop'), q = S.fig === 'curve' ? selPoint() : null;
  if (!q) { pop.hidden = true; return; }
  pop.hidden = false;
  const r = ui.getBoundingClientRect(), st = $('stage').getBoundingClientRect(), dock = $('dock').getBoundingClientRect();
  const w = pop.offsetWidth, h = pop.offsetHeight;
  let x = r.left - st.left + q.x * r.width + 18, y = r.top - st.top + q.y * r.height + 18;
  const right = dock.left - st.left - 12;
  if (x + w > right) x = r.left - st.left + q.x * r.width - w - 18;

const ROWS = [];
function row(def, host) {
  const group = def.group || 'bars', el = document.createElement('div');
  el.className = 'row';
  el.innerHTML = `<label title="${def.hint || def.label}">${def.label}</label><input type=range min=${def.min} max=${def.max} step=${def.step} aria-label="${def.label}"><output></output><button class=reset title="Inherit the default" aria-label="Reset ${def.label}">↺</button>`;
  const input = el.querySelector('input'), out = el.querySelector('output');
  const sync = () => {
    const own = S[group][def.k], v = val(group, def.k);
    el.classList.toggle('inherited', own == null);
    input.value = v;
    input.style.setProperty('--p', ((v - def.min) / (def.max - def.min) * 100) + '%');
    out.textContent = def.int ? Math.round(v) + (def.unit || '') : (+v).toFixed(def.step < 0.01 ? 3 : 2);

  out.set([0, 0, 0, 0, 0, 0, 0, 1], p); return out.subarray(0, p + 8);
}

// ---------------------------------------------------------------- saving
function prune(o) { for (const k of Object.keys(o)) if (o[k] == null || (typeof o[k] === 'object' && !Array.isArray(o[k]) && !Object.keys(o[k]).length)) delete o[k]; return o; }
function payload() {
  // Starts from the file as loaded, so a field this page does not show is
  // written back untouched
  const W = JSON.parse(JSON.stringify(S.W || {}));
  W.mode = S.fig;
  const bars = {...S.bars};
  if (val('bars', 'reveal') > 0) { bars.reveal_source = S.reveal.source === 'auto' ? 'auto' : undefined; bars.reveal_filter = filterString(S.reveal.filter) || undefined; }
  else { delete bars.reveal_source; delete bars.reveal_filter; }
  W.bars = prune(bars);
  W.circle = prune({...S.circle});
  const drawn = S.paths.filter(p => p.pts.length >= 2);
  if (drawn.length) {
    const c = {...(W.curve || {})};
    for (const k of ['points', 'occlude', 'flip', 'upright']) delete c[k];
    c.bars = isNum(S.curve.bars) ? S.curve.bars : undefined;
    c.fit = S.curve.fit === 'stretch' ? 'stretch' : undefined;
    c.height = S.curve.height; c.width = S.curve.width;
    const names = new Set(S.occ.filter(o => o.pts.length >= 2).map(o => o.name));
    c.occluder = S.occ.filter(o => o.pts.length >= 2).map(o => prune({name: o.name, shape: o.shape === 'closed' ? 'closed' : undefined, points: o.pts.map(p => [r4(p.x), r4(p.y)])}));
    if (!c.occluder.length) delete c.occluder;
    c.path = drawn.map(P => prune({
      points: P.pts.map(p => { const v = [r4(p.x), r4(p.y), Math.round(p.s * 100) / 100]; if (p.a != null) v.push(Math.round(p.a)); return v; }),
      bars: P.bars ?? undefined, height: P.height ?? undefined, width: P.width ?? undefined,
      upright: P.up || undefined, flip: P.fl || undefined,
      cut_by: P.cut === null ? undefined : P.cut.filter(n => names.has(n)),
    }));
    W.curve = prune(c);
  } else delete W.curve;
  return prune(W);
}
async function save() {
  if (S.fig === 'curve' && !S.paths.some(p => p.pts.length >= 2)) { toast('A curve needs a path of at least two points', true); return; }
  const btn = $('save'); btn.disabled = true; btn.firstChild.textContent = 'Saving…';
  try {
    // config.toml first; cavawall reloads once, at the end
    const diff = globalDiff(), wall = wallpaperDirty();
    if (diff.length) {
      const r = await fetch('/global', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({set: diff, reload: !wall})}).then(r => r.json());
      if (!r.ok) throw new Error(r.error || 'config.toml was refused');
      S.g0 = JSON.stringify(S.g);
      if (!wall) { toast(`Saved · cavawall ${r.applied}`); setTimeout(refreshLive, 900); return; }
    }
    // The reveal image first, so cavawall finds it when it reloads
    if (val('bars', 'reveal') > 0 && S.reveal.canvas && (S.reveal.changed || !S.ctx.reveal_baked)) {
      const r = await fetch('/reveal', {method: 'POST', body: encodeQoi(S.reveal.canvas)}).then(r => r.json());
      if (!r.ok) throw new Error(r.error || 'the reveal image was refused');
      S.ctx.reveal_baked = true; S.reveal.changed = false;
    } else if (val('bars', 'reveal') <= 0 && S.ctx.reveal_baked) {
      await fetch('/reveal', {method: 'POST', body: ''}); S.ctx.reveal_baked = false;
    }
    const body = payload();
    const r = await fetch('/save', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)}).then(r => r.json());
    if (!r.ok) throw new Error(r.error || 'the save was refused');
    saved = JSON.stringify(body);
    toast(`Saved · cavawall ${r.applied}`);
    setTimeout(refreshLive, 900);
  } catch (e) { toast('Save failed: ' + e.message, true); }
  finally { btn.firstChild.textContent = 'Save & apply'; status(); }
}
$('save').onclick = save;
addEventListener('beforeunload', e => { if (isDirty()) { e.preventDefault(); e.returnValue = ''; } });

// ---------------------------------------------------------------- status
function wallpaperDirty() { return JSON.stringify(payload()) !== saved || S.reveal.changed && val('bars', 'reveal') > 0; }
function isDirty() { return saved && (wallpaperDirty() || globalDiff().length > 0); }
function status() {
  const dirty = isDirty();
  $('save').disabled = !dirty; $('dirty').textContent = dirty ? '● unsaved changes' : 'saved'; $('dirty').classList.toggle('on', !!dirty);
  $('undo').disabled = !hist.length; $('redo').disabled = !future.length;
  let hint = '';
  if (S.fig === 'bars') hint = 'Drag the band to move it, its sides to resize, the dashed edge to set the height';
  else if (S.fig === 'circle') hint = 'Drag the circle to place it, the rim to resize it';
  else if (S.occEdit) hint = S.curOcc >= 0 ? `Editing ${S.occ[S.curOcc]?.name}: click adds, drag moves, right-click deletes` : 'Add an occluder in Layers';
  else hint = S.tool === 'paint' ? 'Paint along the ridge; Thin points tidies it afterwards' : 'Click adds a point, drag moves one, right-click deletes, alt-drag sets its angle';
  $('hint').textContent = hint;
  const {w, h} = S.out;
  $('status').textContent = `${S.fig} · ${effectiveBars()[0]} bars · output ${w}×${h}${S.ctx.image ? ` · image ${S.ctx.image[0]}×${S.ctx.image[1]}` : ''}`;
}
function live(st) {
  const on = st && st.pid;
  $('liveDot').className = 'dot ' + (on ? 'on' : 'off');
  $('liveText').textContent = on ? `cavawall · ${st.mode} · ${st.bars} bars from ${st.bars_from || '?'}${st.placed_on ? ' · ' + st.placed_on : ''}` : 'cavawall is not running';
}
function refreshLive() { fetch('/context').then(r => r.json()).then(c => { S.ctx.status = c.status; live(c.status); }).catch(() => {}); }
setInterval(refreshLive, 10000);
let toastT = 0;
function toast(msg, bad) { const t = $('toast'); t.textContent = msg; t.className = 'toast show' + (bad ? ' bad' : ''); clearTimeout(toastT); toastT = setTimeout(() => t.className = 'toast', bad ? 5000 : 2600); }

// ---------------------------------------------------------------- keys
addEventListener('keydown', e => {
  const typing = /INPUT|SELECT|TEXTAREA/.test(e.target.tagName) && e.target.type !== 'range';
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); if (isDirty()) save(); return; }
  if (typing) return;
  if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
  if (mod) return;
  switch (e.key) {
    case 'v': case 'V': S.occEdit = false; setTool('select'); renderLayers(); drawUI(); break;
    case 'p': case 'P': if (S.fig === 'curve') setTool(S.tool === 'paint' ? 'select' : 'paint'); break;
    case 'o': case 'O': if (S.fig === 'curve') $('toolOcc').click(); break;
    case '[': if (S.fig === 'curve') { S.cur = (S.cur + S.paths.length - 1) % S.paths.length; S.occEdit = false; S.sel = -1; renderLayers(); syncFields(); refreshPathChips(); drawUI(); } break;
    case ']': if (S.fig === 'curve') { S.cur = (S.cur + 1) % S.paths.length; S.occEdit = false; S.sel = -1; renderLayers(); syncFields(); refreshPathChips(); drawUI(); } break;
    case 'Delete': case 'Backspace': { const L = activeList(); if (S.fig === 'curve' && L && S.sel >= 0) { snapshot(); L.splice(S.sel, 1); S.sel = -1; commit(); refreshPoint(); drawUI(); } break; }
    case 'Escape': S.sel = -1; $('viewPop').hidden = $('keysPop').hidden = true; refreshPoint(); drawUI(); break;
    case '?': togglePop('keysPop', 'keysBtn'); break;
    case '0': fitView(); break;
    case ' ': e.preventDefault(); $('play').click(); break;
    default: return;
  }
});
</script>
