<!doctype html><meta charset=utf8>
<title>cavawall - curve editor</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
/* The page fills the viewport and never scrolls: a scrollbar appears exactly
   at the right edge, which is where the last control point is, and grabbing it
   instead of the point is the whole problem. */
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{margin:0;background:#101014;color:#e6e6ea;font:13px/1.5 ui-sans-serif,system-ui,sans-serif;
     display:flex;flex-direction:column}
header{flex:none;display:flex;gap:16px;align-items:center;padding:10px 14px;border-bottom:1px solid #26262e;flex-wrap:wrap}
h1{font-size:13px;margin:0;font-weight:600;letter-spacing:.02em}
.key{font-family:ui-monospace,monospace;color:#8a8a99;font-size:12px}
.spacer{flex:1}
button{background:#1e1e26;color:#e6e6ea;border:1px solid #33333f;border-radius:6px;padding:5px 11px;font:inherit;cursor:pointer}
button:hover{background:#26262f}
button.primary{background:#3b6ea5;border-color:#4a82bd}
button.primary:hover{background:#4880bd}
/* The canvas takes whatever is left and is letterboxed inside it, so the
   image never forces the page to grow in either direction. */
#wrap{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;
      line-height:0;overflow:hidden}
canvas{max-width:100%;max-height:100%;object-fit:contain;cursor:crosshair;touch-action:none;
       transform-origin:0 0;will-change:transform}
#panel{flex:none;display:flex;gap:18px;align-items:center;padding:10px 14px;border-top:1px solid #26262e;flex-wrap:wrap}
label{display:flex;gap:7px;align-items:center;white-space:nowrap;color:#b9b9c6}
input[type=range]{width:130px}
.val{font-family:ui-monospace,monospace;color:#e6e6ea;min-width:42px;display:inline-block}
#out{width:100%;height:132px;flex:none;background:#0b0b0e;color:#c8c8d4;border:0;border-top:1px solid #26262e;
     font-family:ui-monospace,monospace;font-size:12px;padding:10px 14px;resize:vertical}
.hint{color:#71717f;font-size:12px}
.pill{background:#1a1a22;border:1px solid #2c2c36;border-radius:999px;padding:2px 9px;font-size:12px}
/* Fixed width, and the selection controls only hide - they keep their box.
   Either one reflowing its bar resizes the canvas and shifts the view. */
#count{min-width:132px;text-align:center}
#selbox[hidden]{display:flex!important;visibility:hidden}
/* Menus are absolutely positioned, so opening one never reflows a bar and
   never moves the canvas underneath. */
.menu{position:relative;display:inline-block}
.pop{position:absolute;top:calc(100% + 6px);right:0;z-index:5;display:none;min-width:210px;
     background:#16161c;border:1px solid #33333f;border-radius:8px;padding:8px;
     box-shadow:0 10px 30px #0008}
.menu.open .pop{display:flex;flex-direction:column;gap:7px}
.pop label{justify-content:space-between;gap:10px}
.pop button{width:100%;text-align:left}
.pop hr{border:0;border-top:1px solid #26262e;margin:2px 0;width:100%}
.pop input[type=range]{width:96px}
</style>
<header>
  <h1>curve editor</h1>
  <span class=key>__KEY__</span>
  <span class=pill id=count>0 points</span>
  <span class=spacer></span>
  <span class=hint>click add &middot; drag move &middot; right-click delete &middot; shift+drag angle &middot; paint: drag to trace &middot; wheel zoom &middot; middle-drag pan</span>
  <button id=occbtn>occluder: off</button>
  <button id=paintbtn>paint: off</button>
  <div class=menu id=viewmenu>
    <button data-pop>view &#9662;</button>
    <div class=pop>
      <label><input type=checkbox id=showdots checked> handles</label>
      <label>handle size <input type=range id=dotsize min=1 max=14 step=1 value=5></label>
      <label>line width <input type=range id=linew min=1 max=12 step=1 value=3></label>
      <label><input type=checkbox id=showbars checked> bar preview</label>
      <label><input type=checkbox id=showocc checked> occluder</label>
      <label>dim image <input type=range id=dim min=0 max=90 step=5 value=0></label>
      <hr>
      <button id=reset>reset view</button>
    </div>
  </div>
  <div class=menu id=editmenu>
    <button data-pop>edit &#9662;</button>
    <div class=pop>
      <button id=undo>undo &nbsp;<span class=key>ctrl+z</span></button>
      <hr>
      <label>thin &#949; <input type=range id=thineps min=1 max=30 step=1 value=6></label>
      <button id=thin>thin points in active list</button>
      <hr>
      <button id=clear>clear active list</button>
      <button id=clearall>clear everything</button>
    </div>
  </div>
  <button class=primary id=save>save to config</button>
</header>
<div id=wrap><canvas id=c></canvas></div>
<div id=panel>
  <label>bars <input type=range id=bars min=8 max=200 step=1 value=64><span class=val id=barsv>64</span></label>
  <label>height <input type=range id=height min=1 max=40 step=1 value=10><span class=val id=heightv>0.10</span></label>
  <label>width <input type=range id=width min=1 max=30 step=1 value=4><span class=val id=widthv>0.004</span></label>
  <label>curve <input type=range id=opacity min=5 max=100 step=5 value=100><span class=val id=opacityv>1.00</span></label>
  <label><input type=checkbox id=upright> upright</label>
  <label><input type=checkbox id=flip> flip</label>
  <span class=spacer></span>
  <label id=selbox hidden>
    point <span class=val id=selidx>-</span>
    scale <input type=range id=scale min=10 max=150 step=5 value=100><span class=val id=scalev>1.00</span>
    <label><input type=checkbox id=useangle> angle</label>
    <input type=range id=angle min=-180 max=180 step=1 value=0><span class=val id=anglev>0</span>
  </label>
</div>
<textarea id=out readonly spellcheck=false></textarea>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
// Zoom lives in a CSS transform, not in the drawing: getBoundingClientRect
// already reports the transformed box, so pos() keeps returning correct
// normalised coordinates with no maths of its own.
let zoom=1,panx=0,pany=0;
function applyView(){c.style.transform=`translate(${panx}px,${pany}px) scale(${zoom})`;}
function atCursor(e,f){
  // Keep the point under the cursor fixed while the scale changes.
  const w=document.getElementById('wrap').getBoundingClientRect();
  const cx=e.clientX-w.left, cy=e.clientY-w.top;
  const before=zoom; zoom=Math.min(12,Math.max(1,f(zoom)));
  const k=zoom/before;
  panx=cx-(cx-panx)*k; pany=cy-(cy-pany)*k;
  clampPan(); applyView();
}
function clampPan(){
  // At zoom 1 the canvas is letterboxed and must not drift; beyond that, do
  // not let the image be dragged entirely off its own frame.
  if(zoom<=1){panx=pany=0;return;}
  const w=document.getElementById('wrap').getBoundingClientRect();
  const r=c.getBoundingClientRect();
  const sw=r.width, sh=r.height;
  panx=Math.min(0,Math.max(w.width-sw+ (sw/zoom)*0 , panx));
  pany=Math.min(0,Math.max(w.height-sh, pany));
}
const img=new Image(); let pts=[], occ=[], sel=-1, drag=-1, shift=false, hist=[];
// The occluder is a second, independent polyline: the mountain silhouette
// that bars have to hide behind. It is edited with the same handles, so the
// mode flag decides which list a click lands in.
let occmode=false, paintmode=false, painting=false;
const list=()=>occmode?occ:pts;
const $=i=>document.getElementById(i);
for(const m of document.querySelectorAll('.menu')){
  m.querySelector('[data-pop]').onclick=e=>{
    e.stopPropagation();
    const was=m.classList.contains('open');
    document.querySelectorAll('.menu').forEach(o=>o.classList.remove('open'));
    m.classList.toggle('open',!was);
  };
  m.querySelector('.pop').onclick=e=>e.stopPropagation();
}
addEventListener('click',()=>document.querySelectorAll('.menu').forEach(m=>m.classList.remove('open')));
// Capped so a long session cannot grow it without bound.
function pushHist(){hist.push(JSON.stringify({p:pts,o:occ}));if(hist.length>200)hist.shift();}
img.onload=()=>{c.width=img.naturalWidth;c.height=img.naturalHeight;loadExisting();};
img.src='/wallpaper';

function loadExisting(){
  fetch('/existing').then(r=>r.text()).then(t=>{
    const m=t.match(/points\s*=\s*\[([\s\S]*?)\]\s*$/m);
    if(m) for(const row of m[1].matchAll(/\[([^\]]+)\]/g)){
      const v=row[1].split(',').map(s=>parseFloat(s.trim()));
      if(v.length>=2) pts.push({x:v[0],y:v[1],s:v[2]??1,a:v.length>3?v[3]:null});
    }
    const o=t.match(/occlude\s*=\s*\[([\s\S]*?)\n\]/);
    if(o) for(const row of o[1].matchAll(/\[([^\]]+)\]/g)){
      const v=row[1].split(',').map(s=>parseFloat(s.trim()));
      if(v.length>=2) occ.push({x:v[0],y:v[1],s:1,a:null});
    }
    const g=(k,d)=>{const r=t.match(new RegExp(k+'\\s*=\\s*([0-9.]+)'));return r?parseFloat(r[1]):d;};
    $('bars').value=g('bars',64); $('height').value=Math.round(g('height',0.10)*100);
    $('width').value=Math.round(g('width',0.004)*1000);
    $('upright').checked=/upright\s*=\s*true/.test(t); $('flip').checked=/flip\s*=\s*true/.test(t);
    draw();
  }).catch(draw);
}
// Catmull-Rom, matching curve.rs so the preview is the real placement.
function cr(p0,p1,p2,p3,t){const t2=t*t,t3=t2*t;return[0,1].map(i=>0.5*((2*p1[i])+(-p0[i]+p2[i])*t+(2*p0[i]-5*p1[i]+4*p2[i]-p3[i])*t2+(-p0[i]+3*p1[i]-3*p2[i]+p3[i])*t3));}
function dense(){
  if(pts.length<2)return[];
  const o=[],n=pts.length;
  for(let i=0;i<n-1;i++){
    const P=j=>[pts[j].x*c.width,pts[j].y*c.height];
    const p0=P(Math.max(0,i-1)),p1=P(i),p2=P(i+1),p3=P(Math.min(n-1,i+2));
    for(let k=0;k<16;k++){const t=k/16;
      const a1=pts[i].a,a2=pts[i+1].a;
      let a=null; if(a1!=null&&a2!=null)a=a1+(a2-a1)*t; else if(a1!=null)a=a1; else if(a2!=null)a=a2;
      o.push({p:cr(p0,p1,p2,p3,t),s:pts[i].s+(pts[i+1].s-pts[i].s)*t,a});}
  }
  o.push({p:[pts[n-1].x*c.width,pts[n-1].y*c.height],s:pts[n-1].s,a:pts[n-1].a});
  return o;
}
// Height of the silhouette at a given x, in pixels, flat past both ends -
// this is the same rule curve.rs applies when it samples the horizon.
function horizonAt(px){
  if(occ.length<2)return null;
  const q=occ;
  if(px<=q[0].x*c.width)return q[0].y*c.height;
  if(px>=q[q.length-1].x*c.width)return q[q.length-1].y*c.height;
  for(let i=1;i<q.length;i++){
    const a=q[i-1],b=q[i];
    if(px<=b.x*c.width){
      const span=Math.max((b.x-a.x)*c.width,1e-6);
      return (a.y+(b.y-a.y)*((px-a.x*c.width)/span))*c.height;
    }
  }
  return q[q.length-1].y*c.height;
}
function clipAboveHorizon(){
  if(occ.length<2)return false;
  x.save();x.beginPath();x.moveTo(0,0);
  for(let px=0;px<=c.width;px+=4)x.lineTo(px,horizonAt(px));
  x.lineTo(c.width,0);x.closePath();x.clip();
  return true;
}
// One place decides how thick a guide line is: at macro zoom a 3px line is
// wider than the ridge you are tracing.
const lw=()=>+$('linew').value*c.width/1600;
function draw(){
  x.drawImage(img,0,0);
  const alpha=+$('opacity').value/100;
  const d0=+$('dim').value/100;
  if(d0>0){x.fillStyle='rgba(16,16,20,'+d0+')';x.fillRect(0,0,c.width,c.height);}
  const d=dense();
  if(d.length>1){
    x.globalAlpha=alpha;
    x.strokeStyle='#ff3b30';x.lineWidth=lw();x.beginPath();
    d.forEach((q,i)=>i?x.lineTo(q.p[0],q.p[1]):x.moveTo(q.p[0],q.p[1]));x.stroke();
    x.globalAlpha=1;
    // Bar preview at the real sample positions, arc-length spaced.
    if($('showbars').checked){
    const N=+$('bars').value, reach=(+$('height').value/100)*c.height;
    let acc=[0],tot=0;
    for(let i=1;i<d.length;i++){tot+=Math.hypot(d[i].p[0]-d[i-1].p[0],d[i].p[1]-d[i-1].p[1]);acc.push(tot);}
    // Bar WIDTH has to be per bar, not one lineWidth for the batch: the
    // renderer multiplies it by each bar's scale, so a batched stroke would
    // make the width slider look like it does nothing - which it did.
    x.strokeStyle='rgba(255,255,255,.85)';
    // Bars are clipped exactly where the shader discards them, so the preview
    // shows what the silhouette actually hides.
    const clipped=clipAboveHorizon();
    const wpx=(+$('width').value/1000)*c.width;
    let cur=0;
    for(let i=0;i<N;i++){
      const target=tot*(i+0.5)/N;
      while(cur+2<d.length&&acc[cur+1]<target)cur++;
      const seg=Math.max(acc[cur+1]-acc[cur],1e-6),t=Math.min(1,Math.max(0,(target-acc[cur])/seg));
      const a=d[cur].p,b=d[cur+1].p;
      const px=a[0]+(b[0]-a[0])*t, py=a[1]+(b[1]-a[1])*t;
      let nx,ny;
      if(d[cur].a!=null){const r=d[cur].a*Math.PI/180;nx=Math.sin(r);ny=-Math.cos(r);}
      else if($('upright').checked){nx=0;ny=-1;}
      else{const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1;nx=dy/L;ny=-dx/L;}
      if($('flip').checked){nx=-nx;ny=-ny;}
      const s=d[cur].s*reach;
      x.lineWidth=Math.max(1,wpx*d[cur].s);
      x.beginPath();x.moveTo(px,py);x.lineTo(px+nx*s,py+ny*s);x.stroke();
    }
    if(clipped)x.restore();
    }
  }
  if(occ.length>1&&$('showocc').checked){
    x.globalAlpha=alpha;
    x.beginPath();x.moveTo(0,horizonAt(0));
    for(let px=0;px<=c.width;px+=4)x.lineTo(px,horizonAt(px));
    x.lineTo(c.width,c.height);x.lineTo(0,c.height);x.closePath();
    x.fillStyle='rgba(48,213,200,.18)';x.fill();
    x.strokeStyle='#30d5c8';x.lineWidth=lw();
    const a=occ[0].x*c.width, b=occ[occ.length-1].x*c.width;
    // Drawn part: what you actually traced.
    x.beginPath();x.moveTo(a,horizonAt(a));
    for(let px=a;px<=b;px+=4)x.lineTo(px,horizonAt(px));
    x.lineTo(b,horizonAt(b));x.stroke();
    // Past either end the horizon holds flat, which is what the shader does
    // too - dashed and dimmed so it reads as an implication, not as a line
    // you drew across the wallpaper.
    x.save();x.setLineDash([lw()*3,lw()*3]);x.globalAlpha=alpha*0.45;
    x.beginPath();x.moveTo(0,horizonAt(0));x.lineTo(a,horizonAt(a));
    x.moveTo(b,horizonAt(b));x.lineTo(c.width,horizonAt(c.width));x.stroke();
    x.restore();
    x.globalAlpha=1;
  }
  // Handles fade with the curve so they never sit on top of the landing spot
  // you are trying to judge.
  x.globalAlpha=alpha;
  const dot=(p,fill)=>{
    const r=+$('dotsize').value*c.width/1600;
    x.beginPath();x.arc(p.x*c.width,p.y*c.height,r,0,7);
    x.fillStyle=fill;x.fill();
    x.strokeStyle='#101014';x.lineWidth=2;x.stroke();
  };
  if($('showdots').checked){
    pts.forEach((p,i)=>dot(p,!occmode&&i===sel?'#ffd60a':'#ff3b30'));
    occ.forEach((p,i)=>dot(p,occmode&&i===sel?'#ffd60a':'#30d5c8'));
  }
  x.globalAlpha=1;
  $('count').textContent=pts.length+' pts'+(occ.length?' / '+occ.length+' occ':'');
  emit();
}
function pos(e){const b=c.getBoundingClientRect();return{x:(e.clientX-b.left)/b.width,y:(e.clientY-b.top)/b.height};}
function near(p){let bi=-1,bd=1e9;list().forEach((q,i)=>{const d=Math.hypot((q.x-p.x)*c.width,(q.y-p.y)*c.height);if(d<bd){bd=d;bi=i;}});return bd<Math.max(12,c.width/150)?bi:-1;}
c.addEventListener('pointerdown',e=>{
  // Left button only. Middle pans and right deletes, and both used to fall
  // through to "add a point" here.
  if(e.button!==0)return;
  const p=pos(e),i=near(p);shift=e.shiftKey;const L=list();
  if(paintmode){
    pushHist();painting=true;sel=-1;showSel();
    L.push({x:p.x,y:p.y,s:1,a:null});L.sort((a,b)=>a.x-b.x);
    c.setPointerCapture(e.pointerId);draw();return;
  }
  if(i>=0){pushHist();sel=drag=i;showSel();}
  else{pushHist();
       // Keep the list ordered along x so the spline never doubles back.
       L.push({x:p.x,y:p.y,s:1,a:null});L.sort((a,b)=>a.x-b.x);
       sel=L.findIndex(q=>q.x===p.x&&q.y===p.y);drag=sel;showSel();}
  c.setPointerCapture(e.pointerId);draw();
});
c.addEventListener('pointermove',e=>{
  if(painting){
    const p=pos(e),L=list(),last=L[L.length-1];
    // One point per step along the stroke, not one per mouse event: a slow
    // drag would otherwise bury the list in near-identical points.
    const step=Math.max(6,c.width/160);
    if(!last||Math.hypot((p.x-last.x)*c.width,(p.y-last.y)*c.height)>=step){
      L.push({x:Math.min(1,Math.max(0,p.x)),y:Math.min(1,Math.max(0,p.y)),s:1,a:null});
      L.sort((a,b)=>a.x-b.x);draw();
    }
    return;
  }
  if(drag<0)return;const p=pos(e);const L=list();
  if(shift&&!occmode){const q=L[drag];const dx=p.x-q.x,dy=p.y-q.y;
    q.a=Math.round(Math.atan2(dx*c.width,-dy*c.height)*180/Math.PI);
    $('useangle').checked=true;$('angle').value=q.a;$('anglev').textContent=q.a;}
  else{L[drag].x=Math.min(1,Math.max(0,p.x));L[drag].y=Math.min(1,Math.max(0,p.y));
       const held=L[drag];L.sort((a,b)=>a.x-b.x);drag=L.indexOf(held);sel=drag;}
  draw();
});
c.addEventListener('pointerup',()=>{drag=-1;shift=false;painting=false;});
// Wheel zooms about the cursor; middle button pans.
document.getElementById('wrap').addEventListener('wheel',e=>{
  e.preventDefault(); atCursor(e,z=>e.deltaY<0?z*1.15:z/1.15);
},{passive:false});
let panning=null;
c.addEventListener('pointerdown',e=>{
  if(e.button!==1)return; e.preventDefault();
  panning={x:e.clientX-panx,y:e.clientY-pany}; c.setPointerCapture(e.pointerId);
});
c.addEventListener('pointermove',e=>{
  if(!panning)return;
  panx=e.clientX-panning.x; pany=e.clientY-panning.y; clampPan(); applyView();
});
c.addEventListener('pointerup',e=>{if(e.button===1)panning=null;});
$('reset').onclick=()=>{zoom=1;panx=pany=0;applyView();};
c.addEventListener('contextmenu',e=>{e.preventDefault();const i=near(pos(e));
  if(i>=0){pushHist();list().splice(i,1);sel=-1;showSel();draw();}});
function showSel(){
  const b=$('selbox');
  if(sel<0||occmode){b.hidden=true;return;}
  b.hidden=false;$('selidx').textContent=sel;
  $('scale').value=Math.round(pts[sel].s*100);$('scalev').textContent=pts[sel].s.toFixed(2);
  $('useangle').checked=pts[sel].a!=null;
  $('angle').value=pts[sel].a??0;$('anglev').textContent=pts[sel].a??0;
}
$('scale').oninput=e=>{if(sel<0)return;pts[sel].s=+e.target.value/100;$('scalev').textContent=pts[sel].s.toFixed(2);draw();};
$('angle').oninput=e=>{if(sel<0||!$('useangle').checked)return;pts[sel].a=+e.target.value;$('anglev').textContent=e.target.value;draw();};
$('useangle').onchange=e=>{if(sel<0)return;pts[sel].a=e.target.checked?+$('angle').value:null;draw();};
$('opacity').oninput=()=>{$('opacityv').textContent=(+$('opacity').value/100).toFixed(2);draw();};
for(const id of ['showdots','showbars','showocc']) $(id).onchange=draw;
for(const id of ['dotsize','dim','linew']) $(id).oninput=draw;
// Ramer-Douglas-Peucker: a painted stroke lands hundreds of points where a
// dozen describe the same line, and every one of them is a handle in the way.
function rdp(list,eps){
  if(list.length<3)return list;
  const P=q=>[q.x*c.width,q.y*c.height];
  const keep=new Array(list.length).fill(false);
  keep[0]=keep[list.length-1]=true;
  const stack=[[0,list.length-1]];
  while(stack.length){
    const [a,b]=stack.pop();
    if(b-a<2)continue;
    const A=P(list[a]),B=P(list[b]);
    const dx=B[0]-A[0],dy=B[1]-A[1],L=Math.hypot(dx,dy)||1;
    let worst=-1,wd=0;
    for(let i=a+1;i<b;i++){
      const C=P(list[i]);
      const d=Math.abs(dy*C[0]-dx*C[1]+B[0]*A[1]-B[1]*A[0])/L;
      if(d>wd){wd=d;worst=i;}
    }
    if(wd>eps&&worst>0){keep[worst]=true;stack.push([a,worst],[worst,b]);}
  }
  return list.filter((_,i)=>keep[i]);
}
$('thin').onclick=()=>{
  pushHist();
  const eps=+$('thineps').value;
  if(occmode)occ=rdp(occ,eps);else pts=rdp(pts,eps);
  sel=-1;showSel();draw();
};
$('clearall').onclick=()=>{pushHist();pts=[];occ=[];sel=-1;showSel();draw();};
for(const id of ['bars','height','width']) $(id).oninput=()=>{
  $('barsv').textContent=$('bars').value;
  $('heightv').textContent=(+$('height').value/100).toFixed(2);
  $('widthv').textContent=(+$('width').value/1000).toFixed(3);draw();};
for(const id of ['upright','flip']) $(id).onchange=draw;
function undo(){const h=hist.pop();if(h){const st=JSON.parse(h);pts=st.p;occ=st.o;sel=-1;showSel();draw();}}
$('undo').onclick=undo;
// Ctrl+Z anywhere on the page, not just with the canvas focused - the canvas
// takes no keyboard focus of its own.
addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&e.target.tagName!=='TEXTAREA'){
    e.preventDefault();undo();
  }
});
// Every mutation pushes history first, so undo has something to pop.
$('clear').onclick=()=>{pushHist();if(occmode)occ=[];else pts=[];sel=-1;showSel();draw();};
$('paintbtn').onclick=()=>{paintmode=!paintmode;
  $('paintbtn').textContent='paint: '+(paintmode?'ON':'off');
  $('paintbtn').classList.toggle('primary',paintmode);
  c.style.cursor=paintmode?'cell':'crosshair';};
$('occbtn').onclick=()=>{occmode=!occmode;sel=-1;
  $('occbtn').textContent='occluder: '+(occmode?'ON':'off');
  $('occbtn').classList.toggle('primary',occmode);showSel();draw();};
function emit(){
  const rows=pts.map(p=>{
    const v=[p.x.toFixed(4),p.y.toFixed(4),p.s.toFixed(2)];
    if(p.a!=null)v.push(p.a.toFixed(0));
    return '  ['+v.join(', ')+'],';
  }).join('\n');
  $('out').value=
    'bars = '+$('bars').value+'\n'+
    'height = '+(+$('height').value/100).toFixed(2)+'\n'+
    'width = '+(+$('width').value/1000).toFixed(3)+'\n'+
    ($('upright').checked?'upright = true\n':'')+
    ($('flip').checked?'flip = true\n':'')+
    (occ.length>1?'occlude = [\n'+occ.map(p=>'  ['+p.x.toFixed(4)+', '+p.y.toFixed(4)+'],').join('\n')+'\n]\n':'')+
    'points = [\n'+rows+'\n]';
}
$('save').onclick=()=>{
  if(pts.length<2){alert('need at least two points');return;}
  const btn=$('save'); btn.textContent='saving...';
  fetch('/save',{method:'POST',body:$('out').value})
    .then(r=>r.text().then(t=>({ok:r.ok,t})))
    .then(({ok,t})=>{
      // Never report success on a failure: the previous version swallowed
      // every error into "saved", so a save that never happened looked
      // identical to one that did.
      btn.textContent = ok&&t==='saved' ? 'saved - cavawall restarted' : 'FAILED: '+t;
      if(ok) setTimeout(()=>btn.textContent='save to config',2500);
    })
    .catch(e=>{btn.textContent='FAILED: '+e.message;});
};
</script>
