# Alpha is a float and can take value from 0.0 to 1.0
# All colors here can be either just "#FFFFFF" or { hex: "#FFFFFF", alpha:1.0 }
# If alpha is not specified, it is considered 1.0.
[general]
framerate = 60
background_color = { hex = "#000000", alpha = 0.0 }
# autosens = true
# sensitivity = 100
# Mirroring. cava defaults to channels = "stereo", and stereo does NOT give
# each bar its own frequency band: it splits the bars in half, drawing the left
# channel REVERSED across the left half and the right channel across the right
# half. Most music has near-identical channels, so the two halves come out as
# mirror images with the bass meeting in the middle.
#
# Set "mono" for a single left-to-right spectrum across every bar. Left unset,
# cava's own default applies.
# channels = "mono"
# With mono: "average" (cava's default), "left" or "right".
# mono_option = "average"
# Which monitor to draw on. Left unset, an external monitor is preferred and
# the machine's own panel (eDP*/LVDS*/DSI*) is the fallback, re-evaluated
# whenever one is plugged in or out -- so this only needs setting to override
# that. Names come from `hyprctl monitors all` on Hyprland.
#
# CAVAWALL_OUTPUT in the environment overrides this, which is how an external
# supervisor can move the visualiser between monitors without editing a file.
# A name that matches nothing connected draws nothing at all, deliberately,
# rather than falling back to some other monitor.
# preferred_output = ""
# Source cava captures from, forwarded to its [input] section as
# method=pulse, source=<this>. Left unset, cava monitors whatever the current
# DEFAULT SINK is -- which goes silent the moment that sink's monitor does
# not work (a Bluetooth A2DP sink, for one). Point it at a source that stays
# put across output switches.
# audio_source = ""

[bars]
amount = 76
# `gap` is part of the actual bar width, so if `gap` is 0.1 then the gap width is 10% of the bar width.
gap = 0.1

[colors]
# These parameters can be named however you like, only the values matter here.
gradient_color_1 = '#94e2d5'
gradient_color_2 = '#89dceb'
gradient_color_3 = '#74c7ec'
gradient_color_4 = '#89b4fa'
gradient_color_5 = '#cba6f7'
gradient_color_6 = '#f5c2e7'
gradient_color_7 = '#eba0ac'
gradient_color_8 = '#f38ba8'

[smoothing]
# Smoothing just passes these parameters to cava, so description is also copied(I didn't add support to deprecated options)

# Disables or enables the so-called "Monstercat smoothing" with or without "waves". Set to 0 to disable.
# monstercat = 0
# At the time of writing this line of code, waves work properly in raw mode(which cavawall relies on) only if you compile cava from github.
# waves = 0

# Noise reduction, float 0 - 1. default 0.77
# the raw visualization is very noisy, this factor adjusts the integral and gravity filters to keep the signal smooth
# 1 will be very slow and smooth, 0 will be fast but noisy.
# noise_reduction = 0.77
