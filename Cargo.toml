[package]
name = "cavawall"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "cavawall"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
gl = "0.14.0"
libc = "0.2"
khronos-egl = { version = "6.0.0", features = [
    "static",
    "1_0",
    "1_1",
    "1_2",
    "1_3",
    "1_4",
    "1_5",
] }
serde = { version = "1.0.203", features = ["derive"] }
# Pinned to an explicit revision. Upstream tracked this git dependency without
# one, so cargo re-resolved it to whatever HEAD happened to be -- and HEAD has
# since moved the delegate macros, which breaks the build outright. That is why
# upstream's README insists on `cargo install --locked`; with a rev here, an
# ordinary `cargo build` is reproducible and --locked is no longer load-bearing.
smithay-client-toolkit = { git = "https://github.com/Smithay/client-toolkit.git", rev = "9aeccd9047ec631eafcd4dd63f9420b7fc3cc8d7" }
toml = "0.8.14"
wayland-client = "0.31.2"
wayland-egl = "0.32.0"
wayland-protocols = "0.31.2"
wayland-protocols-wlr = "0.3.1"

# Upstream ships no release profile, so cargo defaults apply: no LTO, 16
# codegen units, symbols left in. This is a long-lived background process on a
# laptop, so trade build time for a smaller, tighter binary.
#
# Honest scope: this does NOT reduce GPU load. The process already sits at 0%
# CPU -- it blocks on cava's pipe and issues a handful of GL calls per frame,
# and the real cost is the compositor compositing a full-screen surface. These
# flags shrink the binary and marginally tighten the hot loop, nothing more.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
