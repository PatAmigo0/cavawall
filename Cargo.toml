[package]
name = "cavawall"
version = "0.6.0"
license = "GPL-3.0-or-later"
edition = "2024"

[[bin]]
name = "cavawall"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# cavawallctl only; the daemon links none of it
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
gl = "0.14.0"
libc = "0.2"
khronos-egl = { version = "6.0.0", features = [
    "static",
    "1_0",
    "1_1",
    "1_2",
    "1_3",
    "1_4",
    "1_5",
] }
serde = { version = "1.0.203", features = ["derive"] }
# Caelestia writes JSON; reading it here is what removes the external script
# that used to translate it into this program's TOML.
serde_json = "1"
smithay-client-toolkit = "0.21.1"
toml = "1"
# Edits config.toml and wallpaper files in place, keeping their comments
toml_edit = "0.25"
wayland-client = "0.31.2"
wayland-egl = "0.32.0"
wayland-protocols = "0.32"
wayland-protocols-wlr = "0.3.1"

# Upstream ships no release profile, so cargo defaults apply: no LTO, 16
# codegen units, symbols left in. This is a long-lived background process on a
# laptop, so trade build time for a smaller, tighter binary.
#
# Honest scope: this does NOT reduce GPU load. The process already sits at 0%
# CPU -- it blocks on cava's pipe and issues a handful of GL calls per frame,
# and the real cost is the compositor compositing a full-screen surface. These
# flags shrink the binary and marginally tighten the hot loop, nothing more.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# GL and pixel maths cast between ints and floats by design
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"
# Slower here: f32::midpoint goes through f64, hypot guards overflow that can't happen
manual_midpoint = "allow"
imprecise_flops = "allow"
# Style that fights this codebase
doc_markdown = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
too_long_first_doc_paragraph = "allow"
redundant_pub_crate = "allow"
similar_names = "allow"
many_single_char_names = "allow"
struct_excessive_bools = "allow"
option_if_let_else = "allow"
wildcard_imports = "allow"
# Maps only ever come from serde, with the default hasher
implicit_hasher = "allow"
# Consts sit beside their one use
items_after_statements = "allow"
